# Starter source registry for Phase 1.
# EVERY entry is unverified until Task 0 (spec §6.3) confirms:
#   - the endpoint
#   - the response format
#   - rate limits
#   - terms, including whether excerpts may be stored
# Keep `enabled: false` until then. Feed URLs change; if one is wrong, find the
# publisher's current official feed, or mark the source unsupported.
#
# Record Task 0 results in each entry's `terms_notes:` field.
# `pnpm seed` upserts these entries by `key` (definition fields only). It never
# touches runtime state: watermarks live in the source_state table, not in `config`.
# Item and fingerprint rules per connector: spec §6.2.1.

defaults:
  enabled: false
  rate_limit_per_min: 10

sources:
  # ---------- Broad global coverage ----------
  - key: gdelt-indopacific
    name: GDELT DOC API — Indo-Pacific security
    terms_notes: "Task 0 (2026-11-07): works intermittently; 1 req/5s limit, shared across all GDELT sources. No excerpt in ArtList. Terms (via search): open use, must cite GDELT with link. Recommend enable as limited."
    enabled: true
    connector_type: gdelt
    access_method: public_api
    tracks: [indopacific_defense]
    cadence_minutes: 30
    config:
      endpoint: https://api.gdeltproject.org/api/v2/doc/doc
      rate_limit_group: gdelt     # GDELT allows 1 request / 5 s across all queries
      min_interval_ms: 6000
      query: '(Taiwan OR "South China Sea" OR "East China Sea" OR Okinawa OR "Korean Peninsula" OR PLA) (military OR defense OR security)'
      mode: ArtList
      max_records: 75

  - key: gdelt-ai-tech
    name: GDELT DOC API — AI & technology
    terms_notes: "Task 0 (2026-11-07): works intermittently; 1 req/5s limit, shared across all GDELT sources. No excerpt in ArtList. Terms (via search): open use, must cite GDELT with link. Recommend enable as limited."
    enabled: true
    connector_type: gdelt
    access_method: public_api
    tracks: [ai_tech]
    cadence_minutes: 60
    config:
      endpoint: https://api.gdeltproject.org/api/v2/doc/doc
      rate_limit_group: gdelt     # GDELT allows 1 request / 5 s across all queries
      min_interval_ms: 6000
      query: '("artificial intelligence" OR "AI model" OR "AI agents" OR "AI regulation")'
      mode: ArtList
      max_records: 75

  - key: gdelt-economy
    name: GDELT DOC API — economy & markets
    terms_notes: "Task 0 (2026-11-07): works intermittently; 1 req/5s limit, shared across all GDELT sources. No excerpt in ArtList. Terms (via search): open use, must cite GDELT with link. Recommend enable as limited."
    enabled: true
    connector_type: gdelt
    access_method: public_api
    tracks: [economy]
    cadence_minutes: 60
    config:
      endpoint: https://api.gdeltproject.org/api/v2/doc/doc
      rate_limit_group: gdelt     # GDELT allows 1 request / 5 s across all queries
      min_interval_ms: 6000
      query: '("interest rates" OR inflation OR "central bank" OR tariffs OR "supply chain" OR "venture funding")'
      mode: ArtList
      max_records: 75

  - key: gdelt-military-family
    name: GDELT DOC API — military family & quality of life
    terms_notes: "Task 0 (2026-11-07): works intermittently; 1 req/5s limit, shared across all GDELT sources. No excerpt in ArtList. Terms (via search): open use, must cite GDELT with link. Recommend enable as limited."
    enabled: true
    connector_type: gdelt
    access_method: public_api
    tracks: [family_life]
    cadence_minutes: 360
    priority: low
    config:
      endpoint: https://api.gdeltproject.org/api/v2/doc/doc
      rate_limit_group: gdelt     # GDELT allows 1 request / 5 s across all queries
      min_interval_ms: 6000
      query: '("military families" OR DoDEA OR "PCS move" OR "SOFA status" OR "base housing")'
      mode: ArtList
      max_records: 50

  # ---------- Government / primary sources ----------
  - key: federal-register-fin-reg
    name: Federal Register — financial regulators
    terms_notes: "Task 0: works, no key; all agency slugs valid; abstract storable. US gov publication. Recommend enable."
    enabled: true
    connector_type: federal_register
    access_method: public_api
    is_primary: true
    tracks: [fintech_reg]
    cadence_minutes: 720
    config:
      endpoint: https://www.federalregister.gov/api/v1/documents.json
      agencies: [consumer-financial-protection-bureau, comptroller-of-the-currency, securities-and-exchange-commission, financial-crimes-enforcement-network]

  - key: federal-register-defense-tech
    name: Federal Register — defense, export controls, FTC, HHS
    terms_notes: "Task 0: works, no key; all agency slugs valid; abstract storable. US gov publication. Recommend enable."
    enabled: true
    connector_type: federal_register
    access_method: public_api
    is_primary: true
    tracks: [defense_acq, ai_tech, health_compliance]
    cadence_minutes: 720
    config:
      endpoint: https://www.federalregister.gov/api/v1/documents.json
      agencies: [defense-department, industry-and-security-bureau, federal-trade-commission, health-and-human-services-department]

  - key: dod-contracts
    name: DoD daily contract announcements
    terms_notes: "Task 0: every defense.gov URL (page, RSS index, robots.txt) returns Akamai 403. Unsupported (rule 4)."
    connector_type: html_page   # look for an official RSS feed first; respect robots.txt
    access_method: permitted_crawl
    is_primary: true
    tracks: [defense_acq]
    cadence_minutes: 1440
    config:
      url: https://www.defense.gov/News/Contracts/

  - key: sam-gov-opportunities
    name: SAM.gov contract opportunities
    terms_notes: "Task 0: needs api_key query param (never store or log). uiLink requires contracting-officer login. No keywords param; use title filter. Untested without key. Enabled 2026-11-07; stays auth_required until SAM_GOV_API_KEY is set."
    enabled: true
    connector_type: sam_gov
    access_method: public_api   # requires SAM_GOV_API_KEY
    is_primary: true
    tracks: [defense_acq]
    cadence_minutes: 1440
    config:
      endpoint: https://api.sam.gov/opportunities/v2/search
      keywords: ["training management", "range management", "case management", "investigative software", "intake automation", "conversational AI"]

  - key: cisa-kev
    name: CISA Known Exploited Vulnerabilities
    terms_notes: "Task 0: works; 1,769 entries; fields match spec. US gov work. Recommend enable."
    enabled: true
    connector_type: cisa_kev
    access_method: public_feed
    is_primary: true
    tracks: [ai_tech]
    cadence_minutes: 360
    config:
      url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      # One evidence item per CVE (source_item_id = cveID); only entries with
      # dateAdded after the watermark are emitted.

  - key: fed-press
    name: Federal Reserve press releases
    terms_notes: "Task 0: works; summaries only. Public domain, cite the Board (federalreserve.gov/disclaimer.htm). Recommend enable."
    enabled: true
    connector_type: rss
    access_method: public_feed
    is_primary: true
    tracks: [economy]
    cadence_minutes: 180
    config:
      url: https://www.federalreserve.gov/feeds/press_all.xml

  # ---------- Signals preview (Phase 1) ----------
  - key: cfpb-complaints
    name: CFPB Consumer Complaint Database
    terms_notes: "Task 0: works; aggregations available. Terms page unreachable from sandbox. Aggregates only. Recommend enable."
    enabled: true
    connector_type: cfpb_complaints
    access_method: public_api
    is_primary: true
    tracks: [signals, fintech_reg]
    cadence_minutes: 1440
    config:
      endpoint: https://www.consumerfinance.gov/data-research/consumer-complaints/search/api/v1/
      products: ["Checking or savings account", "Money transfer, virtual currency, or money service", "Credit reporting or other personal consumer reports"]
      note: "Aggregate trends only in Phase 1; do not surface individual narratives in the brief."
      # One item per product per completed ISO week (source_item_id = "<product>:<ISO week>"),
      # emitted once aggregate_lag_days have passed since the week ended.
      aggregate_lag_days: 7

  - key: cpsc-recalls
    name: CPSC recalls
    terms_notes: "Task 0: works; RecallID and public URL present. Terms page unreachable from sandbox. Recommend enable."
    enabled: true
    connector_type: cpsc_recalls
    access_method: public_api
    is_primary: true
    tracks: [signals]
    cadence_minutes: 1440
    priority: low
    config:
      endpoint: https://www.saferproducts.gov/RestWebServices/Recall
      format: json

  - key: hn-search
    name: Hacker News (Algolia search API)
    terms_notes: "Task 0: works; points filter OK server-side. Queries match loosely; needs phrase or title-only search. ~10k req/hr/IP (third-party). Recommend enable after query fix."
    enabled: true
    connector_type: hn_algolia
    access_method: public_api
    tracks: [signals, ai_tech]
    cadence_minutes: 120
    config:
      endpoint: https://hn.algolia.com/api/v1/search_by_date
      queries: ["Ask HN alternative to", "frustrated with", "open banking", "legal tech", "intake forms", "AI agents"]
      min_points: 20       # applied server-side via numericFilters
      min_age_hours: 12    # only fetch stories at least this old, so points have accrued

